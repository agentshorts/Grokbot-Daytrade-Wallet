name: Build

on:
  pull_request: {}
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: build
        run: dotnet build TradeMonitor.slnx

      - name: test
        run: dotnet test TradeMonitor.slnx --no-build

  client:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: TradeMonitor.Client/package-lock.json

      - name: install
        run: npm ci
        working-directory: TradeMonitor.Client

      - name: test
        run: npm run test:run
        working-directory: TradeMonitor.Client

      - name: build
        run: npm run build
        working-directory: TradeMonitor.Client
